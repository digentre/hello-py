<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wave Survivor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas { display: block; }
#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
#start-screen, #game-over-screen {
  background: rgba(0,0,0,0.85);
  padding: 30px 40px;
  border-radius: 16px;
  text-align: center;
  pointer-events: auto;
  border: 2px solid #f90;
}
#start-screen h1 { color: #f90; font-size: 32px; margin-bottom: 10px; font-family: sans-serif; }
#start-screen p, #game-over-screen p { color: #ccc; font-size: 16px; margin-bottom: 20px; font-family: sans-serif; }
#game-over-screen h1 { color: #f33; font-size: 28px; margin-bottom: 10px; font-family: sans-serif; }
#game-over-screen .score { color: #f90; font-size: 22px; margin-bottom: 20px; font-family: sans-serif; }
.btn {
  background: linear-gradient(180deg, #f90, #d70);
  color: #fff; border: none; padding: 14px 40px;
  font-size: 20px; border-radius: 10px; cursor: pointer;
  font-family: sans-serif; font-weight: bold;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.95); }
.hidden { display: none !important; }
#hud {
  position: absolute; top: 0; left: 0; width: 100%;
  padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: sans-serif; font-size: 16px; color: #fff;
  z-index: 5; pointer-events: none;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}
#hud .hp-bar {
  width: 120px; height: 14px;
  background: #333; border-radius: 7px; overflow: hidden;
  border: 1px solid #666;
}
#hud .hp-fill { height: 100%; background: #0f0; transition: width 0.2s, background 0.2s; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div>
    <div style="margin-bottom:4px">Wave: <span id="wave-num">1</span></div>
    <div class="hp-bar"><div class="hp-fill" id="hp-fill" style="width:100%"></div></div>
  </div>
  <div>
    <div style="text-align:right">Score: <span id="score">0</span></div>
    <div style="text-align:right;margin-top:4px">Kills: <span id="kills">0</span> | Guns: <span id="guns">1</span></div>
  </div>
</div>

<div id="ui-overlay">
  <div id="start-screen">
    <h1>WAVE SURVIVOR</h1>
    <p>Tap to shoot enemies before they reach you!<br>Survive as many waves as you can.</p>
    <button class="btn" id="start-btn">Play</button>
  </div>
  <div id="game-over-screen" class="hidden">
    <h1>GAME OVER</h1>
    <p class="score">Score: <span id="final-score">0</span></p>
    <p>You survived <span id="final-wave">1</span> waves</p>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game state
let state = 'menu'; // menu, playing, gameover
let score = 0, kills = 0, wave = 1;
let player, enemies, projectiles, particles, powerups;
let waveTimer, enemiesRemaining, waveDelay;
let lastTime = 0;
let autoFireTimer = 0;
const AUTO_FIRE_RATE = 0.15; // seconds between auto shots
let gunLevel = 1;
let gunUpTimer = 0; // for showing "GUN UP!" text

// Kill thresholds for each gun level
const GUN_THRESHOLDS = [0, 10, 25, 50, 85, 130, 185, 250];

function getGunLevel(k) {
  let level = 1;
  for (let i = 1; i < GUN_THRESHOLDS.length; i++) {
    if (k >= GUN_THRESHOLDS[i]) level = i + 1;
  }
  return level;
}

// Player
function createPlayer() {
  return {
    x: W / 2, y: H - 80,
    hp: 100, maxHp: 100,
    damage: 10,
    speed: 5,
    size: 20,
    fireRate: 0.2,
    fireTimer: 0,
  };
}

// Enemy types
const ENEMY_TYPES = {
  grunt: { hp: 20, speed: 1, size: 14, color: '#55f', score: 10, damage: 8 },
  fast:  { hp: 10, speed: 2.5, size: 10, color: '#f5f', score: 15, damage: 5 },
  tank:  { hp: 60, speed: 0.6, size: 22, color: '#f55', score: 25, damage: 15 },
  boss:  { hp: 200, speed: 0.4, size: 35, color: '#fa0', score: 100, damage: 25 },
};

function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  const x = Math.random() * (W - 60) + 30;
  enemies.push({
    x, y: -t.size,
    hp: t.hp * (1 + (wave - 1) * 0.15),
    maxHp: t.hp * (1 + (wave - 1) * 0.15),
    speed: t.speed * (1 + (wave - 1) * 0.03),
    size: t.size,
    color: t.color,
    score: t.score,
    damage: t.damage,
    type,
    wobble: Math.random() * Math.PI * 2,
  });
}

function spawnProjectile(tx, ty) {
  const dx = tx - player.x;
  const dy = ty - player.y;
  const baseAngle = Math.atan2(dy, dx);
  const speed = 10;
  const guns = gunLevel;
  const spreadAngle = 0.15; // radians between each gun

  for (let i = 0; i < guns; i++) {
    // Center the spread: offset from -(guns-1)/2 to +(guns-1)/2
    const offset = (i - (guns - 1) / 2) * spreadAngle;
    const angle = baseAngle + offset;
    projectiles.push({
      x: player.x, y: player.y - player.size,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      damage: player.damage,
      size: 4,
      life: 2,
    });
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 0.5 + Math.random() * 0.5,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

function startWave() {
  waveDelay = 2;
  const baseCount = 5 + wave * 3;
  enemiesRemaining = baseCount;

  // Boss every 5 waves
  if (wave % 5 === 0) {
    enemiesRemaining += 1;
  }
  waveTimer = 0;
}

function getSpawnInterval() {
  return Math.max(0.3, 1.2 - wave * 0.05);
}

function pickEnemyType() {
  const r = Math.random();
  if (wave % 5 === 0 && r < 0.1) return 'boss';
  if (wave >= 3 && r < 0.25) return 'tank';
  if (wave >= 2 && r < 0.5) return 'fast';
  return 'grunt';
}

// Input handling
let pointer = { x: W / 2, y: H / 2, down: false };
let moveTarget = null;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  pointer.x = t.clientX;
  pointer.y = t.clientY;
  pointer.down = true;
  if (state === 'playing') handleShoot(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  pointer.x = t.clientX;
  pointer.y = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  pointer.down = false;
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.down = true;
  if (state === 'playing') handleShoot(e.clientX, e.clientY);
});

canvas.addEventListener('mousemove', (e) => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
});

canvas.addEventListener('mouseup', () => { pointer.down = false; });

function handleShoot(tx, ty) {
  if (player.fireTimer <= 0) {
    spawnProjectile(tx, ty);
    player.fireTimer = player.fireRate;
  }
}

// Start / Restart
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

function startGame() {
  state = 'playing';
  score = 0; kills = 0; wave = 1; gunLevel = 1; gunUpTimer = 0;
  player = createPlayer();
  enemies = [];
  projectiles = [];
  particles = [];
  powerups = [];
  startWave();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  updateHUD();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  state = 'gameover';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('game-over-screen').classList.remove('hidden');
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-wave').textContent = wave;
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('kills').textContent = kills;
  document.getElementById('guns').textContent = gunLevel;
  document.getElementById('wave-num').textContent = wave;
  const pct = Math.max(0, (player.hp / player.maxHp) * 100);
  const fill = document.getElementById('hp-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? '#0f0' : pct > 25 ? '#ff0' : '#f00';
}

// Game loop
function gameLoop(now) {
  if (state !== 'playing') return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // Player movement — follow pointer horizontally when held
  if (pointer.down) {
    const dx = pointer.x - player.x;
    if (Math.abs(dx) > 5) {
      player.x += Math.sign(dx) * player.speed * 1.5;
    }
  }
  player.x = Math.max(player.size, Math.min(W - player.size, player.x));

  // Fire timer
  player.fireTimer -= dt;

  // Auto-fire when holding
  if (pointer.down) {
    autoFireTimer -= dt;
    if (autoFireTimer <= 0) {
      // Find nearest enemy to aim at
      let nearest = null, nearDist = Infinity;
      for (const e of enemies) {
        const d = Math.sqrt((e.x - player.x) ** 2 + (e.y - player.y) ** 2);
        if (d < nearDist) { nearDist = d; nearest = e; }
      }
      if (nearest) {
        handleShoot(nearest.x, nearest.y);
      } else {
        handleShoot(player.x, 0);
      }
      autoFireTimer = AUTO_FIRE_RATE;
    }
  } else {
    autoFireTimer = 0;
  }

  // Gun up timer
  if (gunUpTimer > 0) gunUpTimer -= dt;

  // Wave spawning
  if (waveDelay > 0) {
    waveDelay -= dt;
  } else if (enemiesRemaining > 0) {
    waveTimer -= dt;
    if (waveTimer <= 0) {
      spawnEnemy(pickEnemyType());
      enemiesRemaining--;
      waveTimer = getSpawnInterval();
    }
  } else if (enemies.length === 0) {
    // Next wave
    wave++;
    // Heal a bit between waves
    player.hp = Math.min(player.maxHp, player.hp + 15);
    startWave();
  }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.wobble += dt * 3;
    e.x += Math.sin(e.wobble) * e.speed * 0.5;
    e.y += e.speed;

    // Hit player
    if (e.y + e.size > player.y - player.size &&
        Math.abs(e.x - player.x) < e.size + player.size) {
      player.hp -= e.damage;
      spawnParticles(player.x, player.y, '#f00', 8);
      enemies.splice(i, 1);
      if (player.hp <= 0) { gameOver(); return; }
      updateHUD();
      continue;
    }

    // Off screen
    if (e.y > H + 50) {
      player.hp -= e.damage * 0.5;
      enemies.splice(i, 1);
      if (player.hp <= 0) { gameOver(); return; }
      updateHUD();
    }
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;

    if (p.life <= 0 || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) {
      projectiles.splice(i, 1);
      continue;
    }

    // Hit enemy
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = p.x - e.x, dy = p.y - e.y;
      if (dx * dx + dy * dy < (p.size + e.size) ** 2) {
        e.hp -= p.damage;
        spawnParticles(p.x, p.y, '#ff0', 4);
        projectiles.splice(i, 1);
        if (e.hp <= 0) {
          score += e.score;
          kills++;
          const newGunLevel = getGunLevel(kills);
          if (newGunLevel > gunLevel) {
            gunLevel = newGunLevel;
            gunUpTimer = 2; // show "GUN UP!" for 2 seconds
          }
          spawnParticles(e.x, e.y, e.color, 15);
          enemies.splice(j, 1);
          updateHUD();
        }
        break;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 2 * dt; // gravity
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Drawing
function draw() {
  // Background — dark gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#16213e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ground area
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, H - 50, W, 50);

  // Lane lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  // Wave text
  if (waveDelay > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, waveDelay);
    ctx.fillStyle = '#f90';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Wave ${wave}`, W / 2, H / 2 - 40);
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Get ready!', W / 2, H / 2);
    ctx.restore();
  }

  // Gun Up notification
  if (gunUpTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, gunUpTimer);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = 20;
    ctx.fillText(`GUN UP! x${gunLevel}`, W / 2, H / 2 + 40);
    ctx.shadowBlur = 0;
    const nextThreshold = GUN_THRESHOLDS[gunLevel] || '???';
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#afa';
    ctx.fillText(`Next upgrade: ${nextThreshold} kills`, W / 2, H / 2 + 70);
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.size, e.size * 0.8, e.size * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = e.color;
    ctx.beginPath();
    if (e.type === 'boss') {
      // Boss - pentagon shape
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const method = i === 0 ? 'moveTo' : 'lineTo';
        ctx[method](e.x + Math.cos(a) * e.size, e.y + Math.sin(a) * e.size);
      }
      ctx.closePath();
    } else if (e.type === 'tank') {
      // Tank - square
      ctx.rect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
    } else {
      // Circle for others
      ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    }
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.x - e.size * 0.3, e.y - e.size * 0.2, e.size * 0.2, 0, Math.PI * 2);
    ctx.arc(e.x + e.size * 0.3, e.y - e.size * 0.2, e.size * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(e.x - e.size * 0.3, e.y - e.size * 0.1, e.size * 0.1, 0, Math.PI * 2);
    ctx.arc(e.x + e.size * 0.3, e.y - e.size * 0.1, e.size * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.size * 2;
      ctx.fillStyle = '#300';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 8, bw, 4);
      ctx.fillStyle = '#f00';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 8, bw * (e.hp / e.maxHp), 4);
    }
  }

  // Projectiles
  for (const p of projectiles) {
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Trail
    ctx.strokeStyle = 'rgba(255,200,0,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
    ctx.stroke();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  drawPlayer();
}

function drawPlayer() {
  const p = player;
  const x = p.x, y = p.y;

  // Glow
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 15;

  // Body (triangle/ship shape)
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(x, y - p.size);
  ctx.lineTo(x - p.size, y + p.size * 0.6);
  ctx.lineTo(x - p.size * 0.4, y + p.size * 0.3);
  ctx.lineTo(x, y + p.size * 0.5);
  ctx.lineTo(x + p.size * 0.4, y + p.size * 0.3);
  ctx.lineTo(x + p.size, y + p.size * 0.6);
  ctx.closePath();
  ctx.fill();

  // Inner highlight
  ctx.fillStyle = '#4df';
  ctx.beginPath();
  ctx.moveTo(x, y - p.size * 0.5);
  ctx.lineTo(x - p.size * 0.4, y + p.size * 0.2);
  ctx.lineTo(x + p.size * 0.4, y + p.size * 0.2);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // Engine flame
  ctx.fillStyle = Math.random() > 0.5 ? '#f80' : '#ff0';
  ctx.beginPath();
  ctx.moveTo(x - 5, y + p.size * 0.5);
  ctx.lineTo(x, y + p.size * 0.5 + 8 + Math.random() * 6);
  ctx.lineTo(x + 5, y + p.size * 0.5);
  ctx.closePath();
  ctx.fill();
}
</script>
</body>
</html>
